[project]
name = "bellhub"
version = "1.0.0"
description = "BellHub：单机多设备 Agent 协作中枢（面板 + MCP Hub + Worker + 对话总线）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BellHub contributors" }]
keywords = ["agent", "mcp", "multi-agent", "deepseek-harness", "self-hosted", "sqlite"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=5.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastmcp>=4.1.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
