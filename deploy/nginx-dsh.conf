# BellHub nginx 路由（:80；公网入口交给前面的隧道或直接给本机证书）
#   /           → 统一面板 8010（登录 / 按角色渲染 admin/user 视图）
#   /dsh/       → DeepSeek Harness 3080（管理员机娘 UI，剥前缀，cookie 路径改写）
#   /mcp-hub/   → MCP Hub 8765（外部 worker 公网接入）
server {
    listen 80;
    server_name agent.example.com _;

    client_max_body_size 4096m;      # 网盘单文件上限 2GB（应用层另有配额校验）
    client_body_timeout 600s;        # 大文件慢速上传：单次读取间隔上限
    proxy_request_buffering off;     # 边收边转发，避免整包缓冲到磁盘

    # ── 统一面板（含工作站 SSE 流式对话 /api/sessions/{sid}/stream）──
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE 必须关闭缓冲并放宽读超时：DSH 事件是块级的，工具执行期间可能
        # 数分钟不产生字节，用默认 60s 会被 nginx 判为上游超时并切断连接
        # （2026-10-13 14:49:58 曾因此中断会话 67581e64a0334ccf）。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── DeepSeek Harness（管理员） ────────────────────────────
    location /dsh/ {
        proxy_pass http://127.0.0.1:3080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ★ 2026-10-13 修正：原先这里写了 `proxy_cookie_path / /dsh/`，把 DSH 签发的
        #   身份 cookie（dsh-auth-*，DSH 自己就设成 Path=/）改写成了 Path=/dsh/，浏览器
        #   于是只在 /dsh/ 开头的请求上携带它；而插件用的是根相对路径
        #   /dsh-any-background/...、/dsh-whale/...（不在 /dsh/ 之下），拿不到 cookie →
        #   插件上传报 401 unauthorized。实测：无头浏览器 cookie 罐 path=/dsh/，
        #   其 POST /dsh-any-background/wallpaper/upload = 401，而 /dsh/api/* = 200。
        #   结论：DSH 的 cookie 必须保持 Path=/，此处不得再改写。
        #   已持有旧 cookie 的浏览器：等它自然过期重签即可（无需清理，旧值对不上新签名会被忽略）。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # DSH token 认证失败(401)时引导到面板入口：登录管理员账号后自动带 token 进入
        proxy_intercept_errors on;
        error_page 401 =302 /dsh-entry;
    }

    # ── DSH 插件根路径（助手 2026-10-13 修 http 405）────────────
    # 背景：主题插件 dsh-any-background 与小鲸鱼挂件 dsh-whale-widget 的浏览器半边
    # 使用「根相对路径」请求自己的资源（/dsh-any-background/{wallpaper,video,font}
    # 及其 /upload，/dsh-whale/widget.js 与 /dsh-whale/*.json）。本机 DSH 挂在 /dsh/
    # 子路径下，这些请求一旦落到 location / 就会打到面板 8010（FastAPI 只有 GET），
    # 上传图片时必然得到 405 Method Not Allowed。这里把这两个命名空间原样转发给
    # DSH 3080（不剥前缀：插件在 3080 根上注册了同名路由）。
    # 认证：DSH 会话 cookie 的 Path=/，浏览器会自动带上；cpolar 边缘 TLS 终结，
    # 本源 http 判断 secure=false，与 nginx 转发的 Host 一致，故校验可通过。
    # 注意：只认这两个前缀的精确路径，不做通配，避免误吞面板或 DSH 自身的路由。
    # ── 可选：第三方挂件（如 dsh-whale-widget）用的命名空间 ──
    # 不装挂件的话，这两个 location 可以整段删掉，不影响面板与 MCP。
    location /dsh-any-background/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # 上传是裸字节流，必须关请求缓冲，否则大图/视频会被整体缓冲到磁盘
        proxy_request_buffering off;
        client_max_body_size 4096m;
    }

    location /dsh-whale/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 4096m;
    }

    # ── MCP Hub（worker 公网接入，streamable-http/SSE） ──────
    # 助手 2026-10-13: 无尾斜杠的 /mcp-hub/mcp 会被上游 Starlette 307 到 /mcp/
    # （丢掉 /mcp-hub 前缀，客户端跟过去会打到面板 404），这里在 nginx 层直接纠正
    location = /mcp-hub/mcp {
        return 307 https://$host/mcp-hub/mcp/;
    }

    location /mcp-hub/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-BellHub-Proxy 1;   # 助手 2026-10-13: 标记公网来源，hub 据此强制 MCP 鉴权
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── MAVLink WSS 中继（P3 2026-10-20）──────────────────────────
    # 链路：Windows 桥 → wss://agent.example.com/mavlink?token=…
    #        → cpolar 边缘 TLS → 本机 :80 → 中继 127.0.0.1:8766 → 127.0.0.1:5760(SITL)
    # 一次性 token（TTL 30 分钟）由 ops/mavlink/tokens.py 签发；中继在回 101 之前核销，
    # 这里只做「没带 token 直接 403」的前置过滤——过期/重放判定只在中继一处，
    # 避免两套状态漂移。
    # token 只能走 query（?token=）：2026-10-20 实测 cpolar 边缘在 WS 升级请求上会丢掉
    # 自定义头（X-Mavlink-Token / Authorization 均为空），只有 URI 原样保留。
    # 因此这里按 $arg_token 判空；凭据落日志的风险用两条封死：
    #   access_log off（访问日志不记 URI）+ error_log crit（上游报错也不带 URI）。
    # 一次性/过期判定仍只在中继一处（中继同时接受 X-Mavlink-Token 头，供本机调试）。
    # 公网唯一入口仍是 443/80，不新开端口。
    location = /mavlink {
        if ($arg_token = "") {
            return 403;
        }
        access_log off;
        error_log /var/log/nginx/mavlink-error.log crit;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # MAVLink 是持续下行流，空闲判定交给中继的 keepalive，不在这里切
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
